name: Check theme

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Revision to check when called by another workflow'
        required: false
        type: string

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './.docker' -prune -o \
            -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          search_dirs=()
          for dir in assets/js tools; do
            if [[ -d "$dir" ]]; then
              search_dirs+=("$dir")
            fi
          done

          if ((${#search_dirs[@]})); then
            find "${search_dirs[@]}" -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
              while IFS= read -r -d '' file; do
                node --check "$file"
              done
          fi

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check whitespace errors
        run: git diff-tree --check --no-commit-id -r HEAD
