services:
  db:
    image: mariadb:11.4
    container_name: curve-typecho-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: typecho
      MARIADB_USER: typecho
      MARIADB_PASSWORD: typecho_dev_password
      MARIADB_ROOT_PASSWORD: root_dev_password
    volumes:
      - ./.docker/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  typecho:
    image: joyqi/typecho:nightly-php8.2-apache
    container_name: curve-typecho
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TIMEZONE: Asia/Shanghai
      MEMORY_LIMIT: 128M
      MAX_POST_BODY: 50M
      TYPECHO_INSTALL: "1"
      TYPECHO_SITE_URL: http://localhost:8081
      TYPECHO_DB_ADAPTER: Pdo_Mysql
      TYPECHO_DB_HOST: db
      TYPECHO_DB_PORT: "3306"
      TYPECHO_DB_USER: typecho
      TYPECHO_DB_PASSWORD: typecho_dev_password
      TYPECHO_DB_DATABASE: typecho
      TYPECHO_DB_PREFIX: typecho_
      TYPECHO_USER_NAME: admin
      TYPECHO_USER_PASSWORD: admin123456
      TYPECHO_USER_MAIL: admin@localhost.local
    ports:
      - "8081:80"
    volumes:
      - ./.docker/typecho/usr:/app/usr
      - ./.docker/typecho/config.inc.php:/app/config.inc.php:ro
      - ./:/app/usr/themes/curve:ro
